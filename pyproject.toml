[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syllavox"
version = "0.7.0"
description = "Local offline text-to-speech reader"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Rubén Crespo Blanco"}]
requires-python = ">=3.10"
keywords = ["text-to-speech", "tts", "piper", "offline", "accessibility"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing",
]

dependencies = [
    "PySide6>=6.5.2,<6.12",
    "fastapi",
    "uvicorn",
    "pydantic",
    "piper-tts[zh]; sys_platform != 'darwin'",
    "piper-tts[zh]==1.7.0; sys_platform == 'darwin'",
    "onnxruntime==1.19.2; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/Ruben-Crespo-Blanco/syllavox"
Repository = "https://github.com/Ruben-Crespo-Blanco/syllavox"
Issues = "https://github.com/Ruben-Crespo-Blanco/syllavox/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "tomli>=2.0; python_version < '3.11'",
]
packaging = [
    "pyinstaller>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]
sherpa = [
    "sherpa-onnx==1.13.6",
    "sherpa-onnx-bin==1.13.6",
]
sapi = [
    "comtypes>=1.4.12,<1.5; sys_platform == 'win32'",
]
macos = [
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-ServiceManagement>=10.0; sys_platform == 'darwin'",
]
linux = [
    "dbus-next>=0.2.3; sys_platform == 'linux'",
    "python-xlib>=0.33; sys_platform == 'linux'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
syllavox = ["assets/*.png"]
